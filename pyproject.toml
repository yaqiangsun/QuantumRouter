[project]
name = "quantumrouter"
dynamic = ["version"]
description = "Unified interface for quantum cloud providers. One API, any backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dotenv>=0.9.9",
    "qiskit>=2.5.2",
    "requests>=2.34.2",
]

# Optional dependencies for each vendor. Install with, e.g.:
#   pip install "quantumrouter[tianyan]"     # TianYan deps only
#   pip install "quantumrouter[all]"        # every vendor's deps
[project.optional-dependencies]
ibm = [
    "qiskit-ibm-provider>=0.11.0",
]
lingyun = [
    "numpy>=2.2.6",
]
tianyan = [
    "cqlib-adapter>=0.3.3",
]
wuyue = [
    # "wuyue==1.1.2",
]
# The quafu provider talks Quafu's cloud REST API directly with `requests`
# and defines circuits with Qiskit; both are core deps, so no extra package
# is needed here (the upstream `pyquafu` package is not used on purpose).
quafu = []
# All vendors at once.
all = [
    "quantumrouter[ibm]",
    "quantumrouter[lingyun]",
    "quantumrouter[quafu]",
    "quantumrouter[tianyan]",
    "quantumrouter[wuyue]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "quantumrouter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["quantumrouter"]
