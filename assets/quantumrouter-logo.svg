<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- QuantumRouter: one hub, any backend -->
  <g fill="none">
    <!-- routing links: hub -> vendor nodes -->
    <g stroke="#2A3566" stroke-width="20" stroke-linecap="round">
      <line x1="256" y1="256" x2="96"  y2="96"/>
      <line x1="256" y1="256" x2="416" y2="96"/>
      <line x1="256" y1="256" x2="96"  y2="416"/>
      <line x1="256" y1="256" x2="416" y2="416"/>
    </g>
    <!-- quantum orbits -->
    <ellipse cx="256" cy="256" rx="200" ry="112" stroke="#3B82F6" stroke-width="26" transform="rotate(45 256 256)"/>
    <ellipse cx="256" cy="256" rx="200" ry="112" stroke="#8B5CF6" stroke-width="26" transform="rotate(-45 256 256)"/>
  </g>
  <!-- vendor (backend) nodes -->
  <g fill="#2A3566">
    <circle cx="96"  cy="96"  r="40"/>
    <circle cx="416" cy="96"  r="40"/>
    <circle cx="96"  cy="416" r="40"/>
    <circle cx="416" cy="416" r="40"/>
  </g>
  <!-- central hub -->
  <circle cx="256" cy="256" r="58" fill="#252F5E"/>
  <circle cx="256" cy="256" r="24" fill="#3B82F6"/>
</svg>
