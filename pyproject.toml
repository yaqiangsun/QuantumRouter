[project]
name = "quantumrouter"
dynamic = ["version"]
description = "Unified interface for quantum cloud providers. One API, any backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "quantumrouter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["quantumrouter"]
